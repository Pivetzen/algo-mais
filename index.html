<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Pedidos - WhatsApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4 font-sans text-slate-800">

  <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
    
    <!-- Cabeçalho -->
    <header class="bg-emerald-600 text-white p-6">
      <div class="flex items-center space-x-3">
        <i class="fa-brands fa-whatsapp text-3xl"></i>
        <div>
          <h1 class="text-xl font-bold">Painel de Montagem de Pedido</h1>
          <p class="text-xs text-emerald-100">Crie o resumo e envie direto para o WhatsApp do cliente</p>
        </div>
      </div>
    </header>

    <div class="p-6 space-y-6">

      <!-- Dados do Cliente -->
      <section class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-4">
        <h2 class="font-bold text-slate-700 flex items-center">
          <i class="fa-solid fa-user text-emerald-600 mr-2"></i> Dados do Cliente
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nome do Cliente</label>
            <input type="text" id="clientName" placeholder="Ex: João Silva" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">WhatsApp (com DDD)</label>
            <input type="tel" id="clientPhone" placeholder="Ex: 85999998888" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white">
          </div>
        </div>
      </section>

      <!-- Adicionar Produtos -->
      <section class="space-y-4">
        <h2 class="font-bold text-slate-700 flex items-center">
          <i class="fa-solid fa-cart-plus text-emerald-600 mr-2"></i> Itens do Pedido
        </h2>
        <div class="grid grid-cols-12 gap-2">
          <input type="text" id="itemDesc" placeholder="Descrição do Item / Produto" class="col-span-6 px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          <input type="number" id="itemQty" value="1" min="1" placeholder="Qtd" class="col-span-2 px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-center">
          <input type="number" id="itemPrice" step="0.01" placeholder="R$ Unit." class="col-span-2 px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          <button onclick="addItem()" class="col-span-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold flex items-center justify-center transition">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>

        <!-- Tabela de Itens -->
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm border-collapse">
            <thead>
              <tr class="border-b border-slate-200 text-slate-500 bg-slate-50">
                <th class="p-2">Item</th>
                <th class="p-2 text-center">Qtd</th>
                <th class="p-2 text-right">Unit.</th>
                <th class="p-2 text-right">Total</th>
                <th class="p-2 text-center">Ação</th>
              </tr>
            </thead>
            <tbody id="itemsTable">
              <tr id="emptyRow">
                <td colspan="5" class="text-center py-6 text-slate-400">Nenhum item adicionado ao pedido.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Observações e Pagamento -->
      <section class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Forma de Pagamento</label>
          <select id="paymentMethod" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white">
            <option value="PIX">PIX</option>
            <option value="Cartão de Crédito">Cartão de Crédito</option>
            <option value="Cartão de Débito">Cartão de Débito</option>
            <option value="Dinheiro">Dinheiro</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Observações / Endereço</label>
          <input type="text" id="orderNotes" placeholder="Ex: Entregar na Rua X, Apto 101" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
      </section>

      <!-- Resumo do Total -->
      <div class="flex justify-between items-center p-4 bg-slate-900 text-white rounded-xl">
        <span class="text-lg font-bold">Total do Pedido:</span>
        <span id="grandTotal" class="text-2xl font-extrabold text-emerald-400">R$ 0,00</span>
      </div>

      <!-- Ações -->
      <button onclick="sendToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg hover:shadow-emerald-200 flex items-center justify-center space-x-2 transition text-lg">
        <i class="fa-brands fa-whatsapp text-2xl"></i>
        <span>Enviar Resumo para Confirmação</span>
      </button>

    </div>
  </div>

  <script>
    let items = [];

    function addItem() {
      const desc = document.getElementById('itemDesc').value.trim();
      const qty = parseInt(document.getElementById('itemQty').value);
      const price = parseFloat(document.getElementById('itemPrice').value);

      if (!desc || isNaN(qty) || isNaN(price) || qty <= 0 || price < 0) {
        alert('Por favor, preencha a descrição, quantidade e valor do item corretamente.');
        return;
      }

      items.push({ desc, qty, price, total: qty * price });

      // Limpar campos
      document.getElementById('itemDesc').value = '';
      document.getElementById('itemQty').value = '1';
      document.getElementById('itemPrice').value = '';

      renderTable();
    }

    function removeItem(index) {
      items.splice(index, 1);
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('itemsTable');
      tbody.innerHTML = '';

      if (items.length === 0) {
        tbody.innerHTML = '<tr id="emptyRow"><td colspan="5" class="text-center py-6 text-slate-400">Nenhum item adicionado ao pedido.</td></tr>';
        document.getElementById('grandTotal').innerText = 'R$ 0,00';
        return;
      }

      let grandTotal = 0;

      items.forEach((item, index) => {
        grandTotal += item.total;
        const tr = document.createElement('tr');
        tr.className = 'border-b border-slate-100 hover:bg-slate-50';
        tr.innerHTML = `
          <td class="p-2 font-medium">${item.desc}</td>
          <td class="p-2 text-center">${item.qty}</td>
          <td class="p-2 text-right">R$ ${item.price.toFixed(2)}</td>
          <td class="p-2 text-right font-bold text-slate-700">R$ ${item.total.toFixed(2)}</td>
          <td class="p-2 text-center">
            <button onclick="removeItem(${index})" class="text-rose-500 hover:text-rose-700 p-1">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('grandTotal').innerText = `R$ ${grandTotal.toFixed(2)}`;
    }

    function sendToWhatsApp() {
      const name = document.getElementById('clientName').value.trim();
      const rawPhone = document.getElementById('clientPhone').value.replace(/\D/g, '');
      const payment = document.getElementById('paymentMethod').value;
      const notes = document.getElementById('orderNotes').value.trim();

      if (!name) {
        alert('Por favor, informe o nome do cliente.');
        return;
      }

      if (items.length === 0) {
        alert('Adicione ao menos um item ao pedido.');
        return;
      }

      let grandTotal = items.reduce((acc, i) => acc + i.total, 0);

      // Montagem do texto formatado para o WhatsApp
      let message = `📋 *RESUMO DO PEDIDO*\n`;
      message += `--------------------------------\n`;
      message += `👤 *Cliente:* ${name}\n`;
      if (notes) message += `📝 *Obs/Endereço:* ${notes}\n`;
      message += `--------------------------------\n`;
      message += `🛒 *ITENS:* \n\n`;

      items.forEach(i => {
        message += `• ${i.qty}x ${i.desc} - R$ ${i.total.toFixed(2)}\n`;
      });

      message += `--------------------------------\n`;
      message += `💳 *Pagamento:* ${payment}\n`;
      message += `💰 *TOTAL:* *R$ ${grandTotal.toFixed(2)}*\n`;
      message += `--------------------------------\n\n`;
      message += `Por favor, confira o pedido acima e nos responda com *CONFIRMADO* para prosseguirmos! 😊`;

      const encodedMessage = encodeURIComponent(message);
      
      // Se houver telefone, abre direto a conversa com o número. Caso contrário, abre a seleção de contato.
      let whatsappUrl = rawPhone 
        ? `https://api.whatsapp.com/send?phone=55${rawPhone}&text=${encodedMessage}`
        : `https://api.whatsapp.com/send?text=${encodedMessage}`;

      window.open(whatsappUrl, '_blank');
    }
  </script>
</body>
</html>
